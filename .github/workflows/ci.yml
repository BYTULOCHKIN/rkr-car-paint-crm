name: PaintAuto — перевірки та деплой
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: paintauto-${{ github.ref }}
  cancel-in-progress: true
env:
  HUSKY: '0'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: 1. Перевірки коду
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Отримати код коміту
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Підготувати Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Підготувати Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.3'
      - name: Відновити кеш залежностей
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - name: Встановити залежності за lockfile
        run: bun install --frozen-lockfile
      - name: Перевірити TypeScript
        run: bun run typecheck
      - name: Перевірити правила коду
        run: bun run lint
      - name: Перевірити бізнес-логіку CRM
        run: bun run test:crm
      - name: Перевірити компоненти інтерфейсу
        run: bun run test:crm:ui
      - name: Перевірити деплой, відкат та звіт про етапи
        run: python3 -m unittest discover -s deploy/tests -v
      - name: Перевірити резервне копіювання SQLite
        run: node --test scripts/tests/crm-backup.test.mjs

  build:
    name: 2. Готовий ARM64-образ
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      BUILD_STANDALONE: 'true'
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_APP_URL: https://paintauto.pp.ua
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /auth/sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /auth/sign-up
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /dashboard/overview
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /dashboard/overview
      NEXT_PUBLIC_SENTRY_DISABLED: 'true'
    steps:
      - name: Отримати перевірений код
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Підготувати Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Підготувати Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.3'
      - name: Відновити кеш залежностей
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - name: Відновити кеш компіляції Next.js
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}-
      - name: Встановити залежності за lockfile
        run: bun install --frozen-lockfile
      - name: Перевірити production-налаштування
        run: |
          [[ "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" == pk_live_* ]] || {
            echo "::error::Set repository variable NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY to the production public key"
            exit 1
          }
      - name: Зібрати Next.js на GitHub runner
        run: |
          started=$SECONDS
          bun run build
          echo "BUILD_SECONDS=$((SECONDS-started))" >> "$GITHUB_ENV"
      - name: Запакувати готовий runtime у Docker-образ
        run: docker build --platform linux/arm64 --file deploy/Dockerfile.runtime --build-arg "VCS_REF=$GITHUB_SHA" --tag "rkr-crm:$GITHUB_SHA" .
      - name: Перевірити SQLite та обробку зображень усередині образу
        run: |
          docker run --rm --network none --entrypoint node "rkr-crm:$GITHUB_SHA" -e "
            const db = new (require('node:sqlite').DatabaseSync)(':memory:');
            db.exec('CREATE TABLE probe(value TEXT)'); db.close();
            require('sharp')({create:{width:1,height:1,channels:3,background:'#ffffff'}})
              .png().toBuffer().then(()=>console.log('ARM64 SQLite and sharp: OK'))
              .catch(error=>{console.error(error);process.exit(1)});
          "
      - name: Стиснути образ для доставки на EC2
        run: |
          mkdir -p .artifacts/release
          docker save "rkr-crm:$GITHUB_SHA" | gzip -1 > .artifacts/release/paintauto-linux-arm64.tar.gz
      - name: Опублікувати готовий образ і SHA256-маніфест
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-deployment.py
      - name: Записати тривалість збірки
        run: |
          {
            echo '### Збірка готового образу'
            echo "Next.js build: **$BUILD_SECONDS с**."
            echo ''
            echo 'Готовий образ зібраний на GitHub ARM64 runner; EC2 його лише імпортує.'
            echo ''
            echo "[Реліз](https://github.com/$GITHUB_REPOSITORY/releases/tag/paintauto-deploy-$GITHUB_SHA)"
          } >> "$GITHUB_STEP_SUMMARY"

  deployment:
    name: 3. Розгортання на AWS
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    environment:
      name: production
      url: https://paintauto.pp.ua
    env:
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Отримати інструмент перевірки етапів
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: EC2 — завантаження готового образу
        run: python3 scripts/wait-for-deploy.py --stage download
      - name: EC2 — перевірка контрольної суми та конфігурації
        run: python3 scripts/wait-for-deploy.py --stage verify
      - name: EC2 — імпорт образу й перевірка архітектури
        run: python3 scripts/wait-for-deploy.py --stage load
      - name: EC2 — резервна копія баз у S3
        run: python3 scripts/wait-for-deploy.py --stage backup
      - name: EC2 — запуск нового контейнера та healthcheck
        run: python3 scripts/wait-for-deploy.py --stage start
      - name: EC2 — підтвердження коміту через HTTPS
        run: python3 scripts/wait-for-deploy.py --stage healthcheck
      - name: Звіт із тривалістю кожного етапу
        if: always()
        run: python3 scripts/wait-for-deploy.py --summary
