name: CRM checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.3'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test:crm
      - run: bun run test:crm:ui
      - name: Verify deployment controller
        run: python3 -m unittest discover -s deploy/tests -v
      - name: Verify SQLite backups
        run: node --test scripts/tests/crm-backup.test.mjs

  deployment:
    name: Wait for production deployment
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - name: Wait for EC2 to publish this commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          sha = os.environ['EXPECTED_SHA']
          for attempt in range(230):
              try:
                  request = urllib.request.Request(
                      'https://paintauto.pp.ua/.well-known/paintauto-release.json',
                      headers={'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(request, timeout=10) as response:
                      if json.load(response).get('commit') == sha:
                          print(f'Production is running {sha}')
                          break
              except (OSError, ValueError):
                  pass
              time.sleep(10)
          else:
              raise SystemExit('Production did not confirm this commit; check paintauto-deploy.service logs')
          PY
